name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun scripts/check-version.ts
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: broker
      - run: bun run typecheck

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cargo test --workspace
      - run: mkdir -p out/bridge out/broker
      - name: Build linux
        if: matrix.platform == 'linux-x64'
        run: cargo build --release -p conduit && cp target/release/libconduit.so out/bridge/ && bun build --compile broker/src/index.ts --outfile out/broker/conduit-mcp-server-linux-x64
      - name: Build windows
        if: matrix.platform == 'windows-x64'
        run: cargo build --release -p conduit && cp target/release/conduit.dll out/bridge/ && bun build --compile broker/src/index.ts --outfile out/broker/conduit-mcp-server-windows-x64.exe
      - name: Build macos universal
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin && cargo build --release -p conduit --target x86_64-apple-darwin && cargo build --release -p conduit --target aarch64-apple-darwin && lipo -create -output out/bridge/libconduit.dylib target/x86_64-apple-darwin/release/libconduit.dylib target/aarch64-apple-darwin/release/libconduit.dylib
      - name: Build macos brokers
        if: matrix.platform == 'macos'
        run: bun build --compile broker/src/index.ts --outfile out/broker/conduit-mcp-server-darwin-arm64 && bun build --compile --target=bun-darwin-x64 broker/src/index.ts --outfile out/broker/conduit-mcp-server-darwin-x64
      - uses: actions/upload-artifact@v7
        with:
          name: bridge-${{ matrix.platform }}
          path: out/bridge
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: broker-${{ matrix.platform }}
          path: out/broker
          if-no-files-found: error

  integration:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: 4.7.1-stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/setup.ts
      - run: cargo build -p conduit
      - run: bun run ci:phases

  assemble:
    needs: [build, integration]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: bun scripts/package-addon.ts --artifacts artifacts --out dist
      - run: cp artifacts/broker-*/conduit-mcp-server-* dist/
      - run: cd dist && sha256sum conduit-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
      - name: Create release
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Conduit $GITHUB_REF_NAME" dist/conduit-addon-*.zip dist/conduit-mcp-server-* dist/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}

  # Runs after assemble because the published README points users at the addon
  # zip on the GitHub release; publishing first would ship a package referencing
  # assets that do not exist yet. npm versions are immutable, so this is the one
  # irreversible step in the workflow and it is gated on a tag.
  publish-npm:
    needs: assemble
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    # Trusted publishing (OIDC): id-token lets the runner mint a token npm
    # exchanges for a credential good for one publish, so no npm secret is
    # stored anywhere. contents stays read because this job only reads the tree,
    # unlike the contents: write the rest of the workflow inherits.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run pack:npm
      # bun publish cannot do OIDC (oven-sh/bun#22423), so npm uploads the
      # tarball Bun just built. This is the only npm invocation in the repo.
      # setup-node must be v7 or newer: earlier majors wrote a dummy _authToken
      # into .npmrc whenever registry-url was set, which npm read as "already
      # authenticated" and then skipped the OIDC exchange.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or newer; the version bundled with
      # a given Node image drifts, so pin it rather than inherit it.
      - run: npm install -g npm@latest
      - name: Check whether this version is already on npm
        id: published
        run: |
          version=$(bun --print 'require("./dist/npm/package.json").version')
          name=$(bun --print 'require("./dist/npm/package.json").name')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")
          if [ "$code" = "200" ]; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm; skipping publish"
          elif [ "$code" = "404" ]; then
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected registry response $code for $name@$version"
            exit 1
          fi
      # No --provenance flag: trusted publishing generates the attestation
      # automatically, and passing it explicitly is an error.
      - name: Publish
        if: steps.published.outputs.already-published == 'false'
        run: cd dist/npm && npm publish
