name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: cargo build --release --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: broker
      - run: bun run typecheck

  # The acceptance runners drive a real Godot editor over the real transport, so
  # this is the only job that exercises the per-OS serve models end to end: Unix
  # sockets on Linux and macOS, and the named pipe and its separate two-thread
  # serve path on Windows. CLAUDE.md claims these runners pass on all three, so
  # all three run here rather than Linux standing in for the others.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GODOT_VERSION: 4.7.1-stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: tools/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}
      - run: bun install --frozen-lockfile
      # Resolves the right release asset per platform and installs Xvfb only on
      # Linux; Windows and macOS render natively (docs/api-gaps.md).
      - run: bun scripts/setup.ts
      - run: cargo build -p conduit
      - run: bun run ci:phases
